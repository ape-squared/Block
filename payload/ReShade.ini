[GENERAL]
EffectSearchPaths=C:\Program Files\GShade\gshade-shaders\Shaders,C:\Program Files\GShade\gshade-shaders\ComputeShaders,.\reshade-shaders\Shaders\**,C:\Users\Public\GShade Custom Shaders\Shaders,C:\Users\Public\GShade Custom Shaders\ComputeShaders
TextureSearchPaths=C:\Program Files\GShade\gshade-shaders\Textures,.\reshade-shaders\Textures\**,C:\Users\Public\GShade Custom Shaders\Textures
PreprocessorDefinitions=RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0
; Slow-PC defaults: only compile techniques used by the active preset; fold uniforms
PerformanceMode=1
SkipLoadingDisabledEffects=1
NoReloadOnInit=0
; Absolute PresetPath / IntermediateCachePath written by configure_gshade_support.ps1
PresetPath=.\gshade-presets\Off.ini

[ADDON]
AddonPath=.\gshade-addons
DisabledAddons=

[OVERLAY]
ClockFormat=1
ShowFPS=0
ShowClock=0

[SCREENSHOT]
SavePath=.
FileFormat=1
JPEGQuality=90

[INPUT]
; Overlay: Shift+B
KeyOverlay=66,0,1,0
KeyReload=0,0,0,0
KeyEffects=0,0,0,0

[STYLE]
; 2 = Block lime accent (dark fills, readable text)
StyleIndex=2
