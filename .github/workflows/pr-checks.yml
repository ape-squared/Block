name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  human-authorship:
    name: Human authorship gate
    runs-on: ubuntu-latest
    steps:
      - name: Require human confirmation in the PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const checks = [
              /i wrote this patch myself/i,
              /no AI-generated/i,
              /docs\/AI_POLICY\.md/i,
              /\[x\]\s*I wrote this patch myself/i,
            ];
            const ok = checks.some((re) => re.test(body));
            if (!ok) {
              core.setFailed(
                "PR description must confirm human authorship (tick the checklist item in .github/PULL_REQUEST_TEMPLATE.md). See docs/AI_POLICY.md — AI-generated patches are not accepted."
              );
            } else {
              core.info("Human authorship confirmation found in PR body.");
            }

  ai-heuristic:
    name: AI heuristic scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed files for common AI tells
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mkdir -p /tmp/block-pr
          git diff --name-only "$BASE...$HEAD" > /tmp/block-pr/files.txt || true
          git diff "$BASE...$HEAD" > /tmp/block-pr/diff.patch || true

          python3 <<'PY'
          import pathlib, re, sys
          diff = pathlib.Path("/tmp/block-pr/diff.patch").read_text(encoding="utf-8", errors="replace")
          # Only added lines
          added = "\n".join(l[1:] for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++"))
          patterns = [
            (r"as an AI language model", "LLM disclaimer"),
            (r"as an AI ([a-z ]+ )?assistant", "LLM disclaimer"),
            (r"I('m| am) (ChatGPT|Claude|Gemini|an AI)", "LLM self-ID"),
            (r"generated by (ChatGPT|GPT-4|Claude|Copilot|Cursor Agent|Gemini)", "generated-by claim"),
            (r"OpenAI|Anthropic|Google Gemini", "provider watermark in comments (review)"),
            (r"Certainly!? Here('s| is) (a|the) (complete|full) ", "assistant waffle"),
            (r"Hope this helps!?$", "assistant sign-off"),
            (r"Let me know if you (need|have) (any )?further", "assistant sign-off"),
            (r"```[a-z]*\n[\s\S]*Note: This (code|implementation) was (generated|written) by", "AI note fence"),
          ]
          hits = []
          for pat, label in patterns:
            for m in re.finditer(pat, added, re.I | re.M):
              snippet = m.group(0).replace("\n", " ")[:120]
              hits.append(f"- [{label}] {snippet}")
          if hits:
            print("Potential AI-authored markers in added lines:")
            print("\n".join(hits[:40]))
            print()
            print("Block does not accept AI-generated contributions (docs/AI_POLICY.md).")
            print("If this is a false positive, explain in the PR and ask a maintainer to override.")
            sys.exit(1)
          print("No common AI watermarks found in added lines.")
          PY

  linux-vulkan:
    name: Linux Vulkan layer (Meson)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            glslang-tools spirv-tools || true
          sudo apt-get install -y python3-pip
          pip3 install --user meson ninja || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure & compile
        run: |
          meson setup build-ci -Dcpp_std=c++23 --buildtype=debugoptimized || \
            meson setup build-ci -Dcpp_std=c++20 --buildtype=debugoptimized
          meson compile -C build-ci

  markdown-links:
    name: Doc path sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          test -f docs/AI_POLICY.md
          test -f docs/VIEWERS.md
          test -f docs/PLATFORMS.md
          test -f CONTRIBUTING.md
          test -f website/latest.json
          test -f website/download/index.html
          test -f website/ai/index.html
          echo OK

  website-ui:
    name: Website UI (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/website-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/website-ui/package.json

      - name: Install + run Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-ui-playwright
          path: |
            tests/website-ui/test-results
            tests/website-ui/playwright-report
          if-no-files-found: ignore
