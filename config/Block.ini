[Input]
#ToggleEffects = KEY_INSERT
# Overlay toggle is Shift+ToggleGui (default Shift+B). Supports Ctrl+/Alt+/Shift+ modifiers.
#ToggleGui = KEY_B
# 0 = passthrough, 1 = block game input when ImGui wants capture, 2 = block while overlay open
InputProcessing = 1

[ReShade]
#EffectSearchPaths = shaders,effects
#TextureSearchPaths = textures
#PreprocessorDefinitions =

[HDR]
# Force HDR swapchain presentation (scrgb or hdr10). Falls back to app format if unsupported.
ForceHDR = 0
Mode = scrgb
PaperWhiteNits = 203

[Depth]
UseAspectRatioHeuristics = 1
DrawStatsHeuristic = 1

[UI]
#FontSize = 14
